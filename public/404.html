<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SkillBridge</title>
  <script>
    // GitHub Pages SPA redirect trick.
    // When a user hits a direct URL (e.g. /skillbridge/blog),
    // GitHub Pages serves this 404.html. We encode the path into
    // the query string and redirect to index.html, which then
    // restores the correct route.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 2).join('/') +
      '/?p=' + encodeURIComponent(l.pathname.slice(1) + l.search) +
      (l.hash || '')
    );
  </script>
</head>
<body></body>
</html>
